name: Security evidence

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain-and-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dependency, secret, header, migration, and RLS static audit
        run: npm run security:audit -- --static
      - name: License policy
        run: npm run security:licenses
      - name: Migration ordering
        run: npm run db:migrations:check
      - name: Create immutable source subject
        run: git archive --format=tar.gz -o artifacts/security/epoca-source.tgz HEAD
      - name: Generate CycloneDX SBOM, provider inventory, and SHA-256 manifest
        run: npm run security:artifacts
      - name: Sign source provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: artifacts/security/epoca-source.tgz
      - name: Sign SBOM attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: artifacts/security/epoca-source.tgz
          sbom-path: artifacts/security/sbom.cyclonedx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-evidence
          path: artifacts/security/
          retention-days: 90
